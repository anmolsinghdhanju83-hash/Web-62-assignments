
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="Profile.css">
</head>

<body>
    <div class="card">
        <div class="avatar">JS</div>

        <h2>Your Name</h2>
        <p class="role">BCA Student</p>

        <p class="description">
            I am a student interested in programming,
            web development and learning new technologies.
        </p>

        <h3>My Skills</h3>
        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>Java</span>
        </div>

        <button onclick="alert('Hello! Nice to meet you.')">
            Say Hello
        </button>
    </div>
</body>
</html>
