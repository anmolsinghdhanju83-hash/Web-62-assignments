
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
        }

        header {
            text-align: center;
            padding: 30px 15px;
            background: #4338ca;
            color: white;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
            padding: 25px;
            max-width: 1200px;
            margin: auto;
        }

        .photo {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 12px #00000015;
        }

        .photo img {
            display: block;
            width: 100%;
            height: 220px;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .photo:hover img {
            transform: scale(1.05);
        }

        .photo p {
            padding: 0 15px;
            font-weight: bold;
        }

        @media (max-width: 750px) {
            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: 1fr;
                padding: 15px;
            }

            .photo img {
                height: 250px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>My Photo Gallery</h1>
        <p>Beautiful Moments and Places</p>
    </header>

    <main class="gallery">
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
                 alt="Beautiful nature">
            <p>Nature</p>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=600"
                 alt="Night sky">
            <p>Night Sky</p>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600"
                 alt="Mountain lake">
            <p>Mountains</p>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600"
                 alt="Green forest">
            <p>Forest</p>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600"
                 alt="Beach and sea">
            <p>Beach</p>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600"
                 alt="Snowy mountain under stars">
            <p>Snowy Mountains</p>
        </div>
    </main>
</body>
</html>
