
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        header {
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 22px;
            max-width: 1250px;
            margin: auto;
            padding: 30px 20px;
        }

        .product {
            background: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 12px #00000010;
        }

        .product img {
            width: 100%;
            height: 170px;
            object-fit: contain;
        }

        .product h3 {
            color: #1e293b;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: #15803d;
        }

        .product button {
            background: #2563eb;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .product button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 900px) {
            .products {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 500px) {
            .products {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Tech Store</h1>
        <p>Find Your Favourite Gadgets</p>
    </header>

    <main class="products">
        <div class="product">
            <img src="https://placehold.co/250x170?text=Headphones"
                 alt="Headphones">
            <h3>Headphones</h3>
            <p>Clear and powerful sound.</p>
            <p class="price">₹1,499</p>
            <button type="button">Buy Now</button>
        </div>

        <div class="product">
            <img src="https://placehold.co/250x170?text=Smartwatch"
                 alt="Smartwatch">
            <h3>Smartwatch</h3>
            <p>Track your daily activity.</p>
            <p class="price">₹2,499</p>
            <button type="button">Buy Now</button>
        </div>

        <div class="product">
            <img src="https://placehold.co/250x170?text=Keyboard"
                 alt="Computer keyboard">
            <h3>Keyboard</h3>
            <p>Comfortable typing experience.</p>
            <p class="price">₹899</p>
            <button type="button">Buy Now</button>
        </div>

        <div class="product">
            <img src="https://placehold.co/250x170?text=Speaker"
                 alt="Bluetooth speaker">
            <h3>Bluetooth Speaker</h3>
            <p>Enjoy music anywhere.</p>
            <p class="price">₹1,199</p>
            <button type="button">Buy Now</button>
        </div>
    </main>
</body>
</html>
