
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .layout {
            display: grid;
            grid-template-columns: 220px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: #172554;
            color: white;
            padding: 25px 20px;
        }

        .sidebar h2 {
            margin-bottom: 35px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 13px 8px;
            border-radius: 6px;
        }

        .sidebar a:hover {
            background: #1e40af;
        }

        main {
            padding: 30px;
            min-width: 0;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            margin: 25px 0;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #0000000d;
        }

        .card p {
            color: #64748b;
        }

        .card h2 {
            color: #2563eb;
        }

        .table-box {
            overflow-x: auto;
            background: white;
            border-radius: 10px;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 400px;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #eff6ff;
        }

        @media (max-width: 800px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                padding: 15px;
            }

            .sidebar h2 {
                margin: 5px 0 12px;
            }

            .sidebar a {
                display: inline-block;
                margin-right: 5px;
            }

            main {
                padding: 18px;
            }

            .cards {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 500px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <h2>My Dashboard</h2>
            <a href="#home">Home</a>
            <a href="#reports">Reports</a>
            <a href="#students">Students</a>
            <a href="#settings">Settings</a>
        </aside>

        <main id="home">
            <div class="topbar">
                <h1>Dashboard Overview</h1>
                <p>Welcome, Anmol!</p>
            </div>

            <section class="cards" id="reports">
                <div class="card">
                    <p>Total Students</p>
                    <h2>250</h2>
                </div>

                <div class="card">
                    <p>Total Courses</p>
                    <h2>12</h2>
                </div>

                <div class="card">
                    <p>Completed Tasks</p>
                    <h2>85%</h2>
                </div>
            </section>

            <section class="table-box" id="students">
                <h2>Recent Students</h2>

                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Course</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>Anmol</td>
                            <td>BCA AI</td>
                            <td>Active</td>
                        </tr>
                        <tr>
                            <td>Rahul</td>
                            <td>BCA</td>
                            <td>Active</td>
                        </tr>
                        <tr>
                            <td>Priya</td>
                            <td>BBA</td>
                            <td>Completed</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</body>
</html>
