
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eaf0f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .profile-card {
            width: 320px;
            background: white;
            text-align: center;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0002;
        }

        .profile-card img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #2563eb;
        }

        h2 {
            color: #1e293b;
            margin-bottom: 5px;
        }

        p {
            color: #64748b;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <div class="profile-card">
        <img src="https://placehold.co/150x150" alt="Profile photo">
        <h2>Anmol Singh</h2>
        <p>BCA AI Student</p>
        <p>Interested in Web Development and Data Science.</p>
        <a href="mailto:student@example.com" class="btn">Contact Me</a>
    </div>
</body>
</html>
