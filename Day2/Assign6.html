
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Menu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        nav {
            background: #172554;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            gap: 25px;
        }

        .menu a {
            color: white;
            text-decoration: none;
        }

        .menu a:hover {
            color: #93c5fd;
        }

        .content {
            text-align: center;
            padding: 70px 20px;
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 20px;
            }

            .menu {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">MyWebsite</div>

        <div class="menu">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <section class="content" id="home">
        <h1>Welcome to My Website</h1>
        <p>A simple responsive navigation menu.</p>
    </section>
</body>
</html>
