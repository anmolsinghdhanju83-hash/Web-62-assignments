
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin: 0;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            padding: 35px 20px;
        }

        .product-card {
            width: 250px;
            background: white;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 3px 12px #0001;
        }

        .product-card img {
            width: 100%;
            height: 160px;
            object-fit: contain;
        }

        .product-card h3 {
            color: #1e293b;
        }

        .price {
            color: #15803d;
            font-weight: bold;
            font-size: 20px;
        }

        .product-card button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        .product-card button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 600px) {
            .product-card {
                width: 100%;
                max-width: 350px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>My Online Store</h1>
        <p>Explore Our Products</p>
    </header>

    <main class="products">
        <div class="product-card">
            <img src="https://placehold.co/250x160?text=Headphones"
                 alt="Headphones">
            <h3>Wireless Headphones</h3>
            <p>High-quality sound.</p>
            <p class="price">₹1,499</p>
            <button type="button">Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/250x160?text=Smartwatch"
                 alt="Smartwatch">
            <h3>Smartwatch</h3>
            <p>Track your daily activity.</p>
            <p class="price">₹2,499</p>
            <button type="button">Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/250x160?text=Speaker"
                 alt="Bluetooth speaker">
            <h3>Bluetooth Speaker</h3>
            <p>Enjoy music anywhere.</p>
            <p class="price">₹999</p>
            <button type="button">Buy Now</button>
        </div>
    </main>
</body>
</html>
