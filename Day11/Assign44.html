
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eff6ff;
            padding: 30px 15px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
        }

        .add-form {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
        }

        button {
            padding: 10px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            background: #2563eb;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 20px 0;
        }

        .filters button {
            background: #64748b;
        }

        .filters button.active {
            background: #1d4ed8;
        }

        ul {
            padding: 0;
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px;
            margin-bottom: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 7px;
        }

        .task-text {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .completed .task-text {
            text-decoration: line-through;
            color: #64748b;
        }

        .edit-btn {
            background: #d97706;
        }

        .delete-btn {
            background: #dc2626;
        }

        .task-check {
            flex: 0 0 auto;
        }

        #message {
            color: #b91c1c;
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            li {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>My To-Do List</h1>

    <form id="taskForm" class="add-form">
        <input type="text" id="taskInput"
               placeholder="Enter a new task"
               aria-label="New task" required>
        <button type="submit" id="submitBtn">Add Task</button>
    </form>

    <p id="message" aria-live="polite"></p>

    <div class="filters" aria-label="Filter tasks">
        <button type="button" class="active"
                data-filter="all">All</button>
        <button type="button"
                data-filter="pending">Pending</button>
        <button type="button"
                data-filter="completed">Completed</button>
    </div>

    <ul id="taskList"></ul>

    <p id="taskCount" aria-live="polite"></p>
</div>

<script>
    // Store all tasks in an array
    let tasks = [];
    let currentFilter = "all";
    let editingId = null;
    let nextId = 1;

    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const submitBtn = document.getElementById("submitBtn");
    const taskList = document.getElementById("taskList");
    const message = document.getElementById("message");
    const taskCount = document.getElementById("taskCount");
    const filterButtons = document.querySelectorAll("[data-filter]");

    // Add a new task or save an edited task
    taskForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const text = taskInput.value.trim();

        if (text === "") {
            message.textContent = "Please enter a task.";
            return;
        }

        if (editingId !== null) {
            const task = tasks.find(function (item) {
                return item.id === editingId;
            });

            if (task) {
                task.text = text;
                message.textContent = "Task updated successfully.";
            }

            editingId = null;
            submitBtn.textContent = "Add Task";
        } else {
            tasks.push({
                id: nextId++,
                text: text,
                completed: false
            });

            message.textContent = "Task added successfully.";
        }

        taskInput.value = "";
        renderTasks();
    });

    // Display tasks based on the selected filter
    function renderTasks() {
        taskList.replaceChildren();

        const visibleTasks = tasks.filter(function (task) {
            if (currentFilter === "pending") {
                return !task.completed;
            }

            if (currentFilter === "completed") {
                return task.completed;
            }

            return true;
        });

        visibleTasks.forEach(function (task) {
            const li = document.createElement("li");

            if (task.completed) {
                li.classList.add("completed");
            }

            // Checkbox for completing a task
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.className = "task-check";
            checkbox.checked = task.completed;
            checkbox.setAttribute(
                "aria-label", "Mark " + task.text + " as completed"
            );

            checkbox.addEventListener("change", function () {
                task.completed = checkbox.checked;
                message.textContent = task.completed
                    ? "Task marked as completed."
                    : "Task marked as pending.";

                renderTasks();
            });

            // Task text
            const span = document.createElement("span");
            span.className = "task-text";
            span.textContent = task.text;

            // Edit button
            const editButton = document.createElement("button");
            editButton.type = "button";
            editButton.className = "edit-btn";
            editButton.textContent = "Edit";

            editButton.addEventListener("click", function () {
                taskInput.value = task.text;
                editingId = task.id;
                submitBtn.textContent = "Save Edit";
                message.textContent = "Edit the task and save it.";
                taskInput.focus();
            });

            // Delete button
            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.className = "delete-btn";
            deleteButton.textContent = "Delete";

            deleteButton.addEventListener("click", function () {
                tasks = tasks.filter(function (item) {
                    return item.id !== task.id;
                });

                if (editingId === task.id) {
                    editingId = null;
                    taskInput.value = "";
                    submitBtn.textContent = "Add Task";
                }

                message.textContent = "Task deleted.";
                renderTasks();
            });

            li.append(checkbox, span, editButton, deleteButton);
            taskList.appendChild(li);
        });

        const completedCount = tasks.filter(function (task) {
            return task.completed;
        }).length;

        const pendingCount = tasks.length - completedCount;

        taskCount.textContent =
            "Total: " + tasks.length +
            " | Pending: " + pendingCount +
            " | Completed: " + completedCount;

        if (visibleTasks.length === 0) {
            const emptyMessage = document.createElement("li");
            emptyMessage.textContent = "No tasks to display.";
            taskList.appendChild(emptyMessage);
        }
    }

    // Filter buttons
    filterButtons.forEach(function (button) {
        button.addEventListener("click", function () {
            currentFilter = button.dataset.filter;

            filterButtons.forEach(function (item) {
                item.classList.toggle("active", item === button);
            });

            message.textContent =
                "Showing " + currentFilter + " tasks.";

            renderTasks();
        });
    });

    // Initial display
    renderTasks();
</script>

</body>
</html>
