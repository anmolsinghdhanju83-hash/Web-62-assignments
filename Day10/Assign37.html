
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Content Updater</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            text-align: center;
            padding: 40px;
        }

        .profile {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0002;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            background: #4f46e5;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="profile">
        <h1>My Profile</h1>

        <h2 id="displayName">Anmol Singh</h2>
        <p id="displayCourse">Course: BCA (AI)</p>

        <input type="text" id="nameInput"
               placeholder="Enter your name">

        <input type="text" id="courseInput"
               placeholder="Enter your course">

        <br>
        <button id="updateBtn">Update Profile</button>

        <p id="message" aria-live="polite"></p>
    </div>

    <script>
        // Select HTML elements
        const nameInput = document.getElementById("nameInput");
        const courseInput = document.getElementById("courseInput");
        const displayName = document.getElementById("displayName");
        const displayCourse = document.getElementById("displayCourse");
        const message = document.getElementById("message");

        // Update the profile when the button is clicked
        document.getElementById("updateBtn").addEventListener("click", function () {
            const name = nameInput.value.trim();
            const course = courseInput.value.trim();

            if (name === "" || course === "") {
                message.textContent = "Please fill in both fields.";
                return;
            }

            // textContent displays text safely instead of interpreting HTML
            displayName.textContent = name;
            displayCourse.textContent = "Course: " + course;
            message.textContent = "Profile updated successfully!";
        });
    </script>

</body>
</html>
